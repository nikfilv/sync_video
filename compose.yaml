services:
  sync-video:
    build: .
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8787}:8787"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
